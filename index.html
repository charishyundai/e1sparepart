<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E1 Sparepart Control</title>
<meta name="theme-color" content="#151b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E1 Sparepart">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;min-height:100vh;background:#151b1a;overflow:hidden}
#app{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:block;background:#151b1a}
#probe{position:fixed;top:0;left:0;width:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e6cba8;font:600 15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#ld img{width:84px;height:84px;border-radius:22px}
</style>
</head>
<body>
<div id="probe"></div>
<div id="ld"><img src="icons/icon-192.png" alt=""><span>E1 Sparepart Control</span></div>
<iframe id="app" title="E1 Sparepart Control" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
// Link of the Apps Script web app (Deploy > Manage deployments > Web app URL, ends with /exec)
var APP_LINK = 'https:/'+'/script.google.com/macros/s/AKfycbx2C5StSOynhII3iDyZevmu-_x-Q5MVUHYs47AUHS7s668LEdaCqpMwFG8xhFqDFZV0/exec';

(function () {
  var f = document.getElementById('app'), probe = document.getElementById('probe');
  var iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var asker = null, last = '';
  function insets() {
    var cs = getComputedStyle(probe);
    var t = Math.round(parseFloat(cs.paddingTop) || 0), b = Math.round(parseFloat(cs.paddingBottom) || 0);
    var portrait = window.innerHeight >= window.innerWidth;
    // iPhone installed app: Safari sometimes reports 0 at first; use the usual notch size instead
    if (iOS && standalone && portrait && t === 0) {
      var big = Math.max(screen.height, screen.width) >= 812;
      t = big ? 48 : 20;
      if (big && b === 0) b = 34;
    }
    return { t: t, b: b, sa: standalone ? 1 : 0 };
  }
  function fit() {
    var h = window.innerHeight;
    // iPhone installed app: the page height can come out one status bar too short, leaving a gap at the bottom
    if (iOS && standalone && window.innerHeight >= window.innerWidth) h = Math.max(h, screen.height);
    f.style.height = h + 'px';
    document.body.style.height = h + 'px';
    var v = insets(), key = v.t + ',' + v.b;
    if (asker && key !== last) { last = key; try { asker.postMessage({ e1ins: v }, '*'); } catch (e) {} }
    return v;
  }
  window.addEventListener('message', function (e) {
    if (e.data && e.data.e1ask) { asker = e.source; last = ''; fit(); }
    if (e.data && e.data.e1fsAsk) {
      // the app asks whether this window can go full screen (hide the title bar, taskbar and browser bars)
      var de = document.documentElement, can = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      try { e.source.postMessage({ e1fsCap: can ? 1 : 0, e1fsState: !!(document.fullscreenElement || document.webkitFullscreenElement) }, '*'); } catch (x) {}
    }
    if (e.data && 'e1fs' in e.data) {
      var el = document.documentElement;
      try {
        if (e.data.e1fs) { var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' }); if (p && p.catch) p.catch(function () {}); }
        else if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      } catch (x) {}
    }
    if (e.data && e.data.e1share) {
      // the app asks to share a file (e.g. the OIT Excel) with the phone's share sheet
      var d = e.data.e1share, src = e.source;
      var reply = function (o) { o.id = d.id; try { src.postMessage({ e1shared: o }, '*'); } catch (x) {} };
      try {
        var file = new File([d.buf], d.name, { type: d.type || 'application/octet-stream' });
        if (!(navigator.canShare && navigator.canShare({ files: [file] }))) { reply({ ok: 0, msg: 'not supported' }); return; }
        navigator.share({ files: [file], title: d.name }).then(function () { reply({ ok: 1 }); })
          .catch(function (err) { reply({ ok: 0, abort: err && err.name === 'AbortError' ? 1 : 0, msg: String(err && err.message || err) }); });
      } catch (err) { reply({ ok: 0, msg: String(err && err.message || err) }); }
    }
  });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (t) {
    document.addEventListener(t, function () {
      var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (asker) { try { asker.postMessage({ e1fsState: on }, '*'); } catch (x) {} }
    });
  });
  window.addEventListener('resize', function () { setTimeout(fit, 60); });
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  var v = fit();
  setTimeout(fit, 400); setTimeout(fit, 1500);
  var sep = APP_LINK.indexOf('?') < 0 ? '?' : '&';
  f.onload = function () { document.getElementById('ld').style.display = 'none'; fit(); };
  // signing link for customers (BAST / BAPP): ?sign=... is passed on to the app
  var sg = (location.search.match(/[?&]sign=([a-f0-9]{24,40})/) || [])[1] || '';
  f.src = APP_LINK + sep + 'pwa=1&sat=' + v.t + '&sab=' + v.b + '&sa=' + v.sa + (sg ? '&sign=' + sg : '');
  if (!sg && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
